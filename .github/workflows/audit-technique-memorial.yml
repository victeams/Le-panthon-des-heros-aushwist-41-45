name: Audit technique accessibilité et performance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-technique-memorial
  cancel-in-progress: true

jobs:
  audit:
    name: Contrôle statique du site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exécuter l'audit en lecture seule
        run: python scripts/audit_technique_memorial.py
      - name: Publier les rapports comme artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-technique-memorial
          path: audit-technique/
          if-no-files-found: warn
          retention-days: 30
