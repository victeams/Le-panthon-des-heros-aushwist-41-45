# Classe les biographies, reconstruit le référencement et publie GitHub Pages.
name: Classer et publier le site

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "site-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tester l’automatisation
        run: python -m unittest discover -s tests -v

      - name: Classer les fiches et reconstruire le site
        run: python scripts/build_site.py

      - name: Vérifier les fichiers générés
        run: git diff --check

      - name: Enregistrer automatiquement les index et miniatures
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html femmes.html hommes.html sitemap.xml robots.txt site-data.json a_verifier.txt portraits
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique des catalogues et du SEO [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configurer GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
