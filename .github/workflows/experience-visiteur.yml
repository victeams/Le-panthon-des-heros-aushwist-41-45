name: Améliorer l'expérience des visiteurs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experience-visiteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les améliorations
        env:
          SITE_BASE: "https://memoiredesdeportes.fr"
          SITE_HOME: "https://memoiredesdeportes.fr/"
        run: |
          mkdir -p assets
          cat > assets/memorial-ux.css <<'CSS'
          :root{--ux-gold:#d4ad62;--ux-panel:#171a1f;--ux-line:#403a30;--ux-text:#f4f1e8;--ux-muted:#c2c5ca}
          .ux-visitor-bar{max-width:1180px;margin:18px auto;padding:16px 18px;border:1px solid var(--ux-line);border-radius:14px;background:linear-gradient(135deg,#201c16,var(--ux-panel));color:var(--ux-text);font-family:Arial,Helvetica,sans-serif}.ux-visitor-bar__top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.ux-visitor-bar strong{font-family:Georgia,serif;font-size:1.15rem}.ux-actions{display:flex;gap:8px;flex-wrap:wrap}.ux-button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border:1px solid #76633f;border-radius:999px;background:#d4ad6216;color:var(--ux-gold)!important;font-weight:700;text-decoration:none!important;cursor:pointer}.ux-button:hover,.ux-button:focus{background:#d4ad6229}.ux-button--primary{background:var(--ux-gold);color:#16120d!important}.ux-search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px}.ux-search input{min-height:48px;width:100%;padding:12px 15px;border:1px solid #525862;border-radius:10px;background:#0d1014;color:white;font-size:16px}.ux-search button{border:0}.ux-share{max-width:900px;margin:34px auto 20px;padding:22px;border:1px solid var(--ux-line);border-radius:14px;background:var(--ux-panel);color:var(--ux-text);text-align:center;font-family:Arial,Helvetica,sans-serif}.ux-share h2{margin:0 0 7px;font:1.45rem Georgia,serif}.ux-share p{margin:0 0 15px;color:var(--ux-muted)}.ux-share__buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.ux-portrait-nav{display:flex;justify-content:space-between;gap:10px;max-width:900px;margin:16px auto 30px;padding:0 12px}.ux-toast{position:fixed;left:50%;bottom:22px;z-index:9999;transform:translateX(-50%);padding:11px 16px;border-radius:999px;background:#f4f1e8;color:#111;box-shadow:0 8px 30px #0008;font:700 14px Arial}.ux-home-highlight{max-width:1180px;margin:0 auto 26px;padding:22px;border:1px solid #5d5039;border-radius:15px;background:linear-gradient(135deg,#211d17,#15191f);text-align:center}.ux-home-highlight h2{margin:0 0 8px;font:1.8rem Georgia,serif}.ux-home-highlight p{color:var(--ux-muted)}.ux-counts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.ux-count{padding:7px 12px;border:1px solid #494238;border-radius:999px;color:var(--ux-muted)}
          .ux-site-footer{margin-top:32px;padding:30px 18px!important;border-top:1px solid var(--ux-line)!important;background:#0d0f12!important;color:var(--ux-muted)!important;text-align:center!important;font:14px/1.6 Arial,Helvetica,sans-serif!important}.ux-site-footer__name{margin:0 0 5px;color:var(--ux-text);font:700 1.15rem Georgia,serif}.ux-site-footer__tagline{margin:0 0 14px}.ux-site-footer__links{display:flex;justify-content:center;gap:8px 18px;flex-wrap:wrap}.ux-site-footer a{color:var(--ux-gold)!important;text-decoration:none}.ux-site-footer a:hover,.ux-site-footer a:focus{text-decoration:underline}.ux-site-footer__legal{margin:14px 0 0;font-size:.82rem;color:#92979f}
          .ux-source-card{max-width:900px;margin:28px auto;padding:22px;border:1px solid var(--ux-line);border-left:4px solid var(--ux-gold);border-radius:12px;background:linear-gradient(135deg,#181b20,#121417);color:var(--ux-text);font:15px/1.65 Arial,Helvetica,sans-serif}.ux-source-card h2{margin:0 0 9px;color:var(--ux-text);font:1.35rem Georgia,serif}.ux-source-card p{margin:7px 0;color:var(--ux-muted)}.ux-source-card strong{color:var(--ux-text)}.ux-source-card__actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.ux-source-card a:not(.ux-button){color:var(--ux-gold)}
          .ux-page-lift{position:fixed;right:16px;top:50%;z-index:9998;display:flex;flex-direction:column;gap:7px;transform:translateY(-50%);padding:6px;border:1px solid var(--ux-line);border-radius:999px;background:#0d0f12e8;box-shadow:0 8px 25px #0008;backdrop-filter:blur(6px)}.ux-page-lift button{display:grid;width:44px;height:44px;place-items:center;border:1px solid #76633f;border-radius:50%;background:#201c16;color:var(--ux-gold);font:700 22px/1 Arial;cursor:pointer}.ux-page-lift button:hover,.ux-page-lift button:focus{background:var(--ux-gold);color:#16120d}.ux-page-lift button:disabled{opacity:.28;cursor:default}.ux-page-lift button:disabled:hover{background:#201c16;color:var(--ux-gold)}
          @media(max-width:680px){.hero,.home-hero{min-height:auto!important;padding-top:24px!important;padding-bottom:24px!important}.brand-logo{width:92px!important}.hero h1{font-size:clamp(1.8rem,9vw,2.6rem)!important}.hero .intro{margin-top:12px!important}.hero .content-notice,.hero .free-notice,.hero .sister-site{margin-top:10px!important}.nav{display:flex!important;flex-wrap:nowrap!important;justify-content:flex-start!important;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a{white-space:nowrap}.ux-visitor-bar{margin:10px 12px;padding:14px}.ux-search{grid-template-columns:1fr}.ux-actions{width:100%}.ux-button{flex:1}.ux-share{margin:24px 12px}.ux-source-card{margin:24px 12px;padding:18px}.ux-portrait-nav{flex-direction:column}.ux-home-highlight{margin:10px 12px 20px;padding:18px}.grid{scroll-margin-top:120px}.ux-page-lift{right:8px;top:auto;bottom:82px;transform:none}.ux-page-lift button{width:40px;height:40px}}
          CSS
          cat > assets/memorial-ux.js <<'JS'
          (()=>{"use strict";const S=document.currentScript?.dataset||{},home=S.home||"/";const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const toast=t=>{const e=document.createElement("div");e.className="ux-toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};const cards=()=>[...document.querySelectorAll(".card,article.portrait-card,[data-name]")].filter(e=>e.querySelector("a[href]"));const links=()=>[...new Set(cards().map(e=>e.querySelector("a[href]")?.href).filter(Boolean))];const random=()=>{const a=links();location.href=a.length?a[Math.floor(Math.random()*a.length)]:home+"#portraits"};const old=document.querySelector('input[type="search"],#search,#recherche,input[name="search"]');const bar=document.createElement("section");bar.className="ux-visitor-bar";bar.innerHTML='<div class="ux-visitor-bar__top"><strong>Retrouver une histoire, transmettre une mémoire</strong><div class="ux-actions"><a class="ux-button" href="'+esc(home)+'">Accueil</a><button class="ux-button ux-random" type="button">Portrait au hasard</button><a class="ux-button ux-button--primary" href="#ux-search">Rechercher</a></div></div><form class="ux-search" id="ux-search"><input aria-label="Rechercher une personne" type="search" autocomplete="off" placeholder="Nom, prénom ou matricule"><button class="ux-button ux-button--primary" type="submit">Rechercher</button></form>';const target=document.querySelector("main")||document.body.firstElementChild;target.parentNode.insertBefore(bar,target);bar.querySelector(".ux-random").onclick=random;const input=bar.querySelector("input"),filter=()=>{const q=input.value.trim().toLocaleLowerCase("fr");let n=0;cards().forEach(c=>{const ok=!q||c.textContent.toLocaleLowerCase("fr").includes(q);c.hidden=!ok;if(ok)n++});if(old){old.value=q;old.dispatchEvent(new Event("input",{bubbles:true}))}return n};input.oninput=filter;bar.querySelector("form").onsubmit=e=>{e.preventDefault();const n=filter();document.querySelector("#portraits,.grid,.cards")?.scrollIntoView({behavior:"smooth"});if(!n)toast("Aucun portrait trouvé sur cette page")};const clean=u=>u.replace(/index\.html(?:[?#].*)?$/,"").replace(/\/$/,""),isHome=clean(location.href)===clean(home);if(isHome){const box=document.createElement("section");box.className="ux-home-highlight";box.innerHTML='<p style="margin:0;color:var(--ux-gold);font-weight:700">MÉMORIAL NUMÉRIQUE</p><h2>Chaque visage mérite d’être retrouvé</h2><p>Un nouveau portrait est régulièrement ajouté pour que son histoire ne disparaisse jamais.</p><div class="ux-counts"><span class="ux-count"><strong>'+cards().length+'</strong> portraits visibles</span><span class="ux-count">Accès libre et gratuit</span></div><div class="ux-actions" style="justify-content:center;margin-top:14px"><button class="ux-button ux-button--primary ux-random" type="button">Découvrir une histoire</button><a class="ux-button" href="#ux-search">Chercher un proche</a></div>';bar.after(box);box.querySelector(".ux-random").onclick=random}const share=document.createElement("section");share.className="ux-share";share.innerHTML='<h2>Transmettre sa mémoire</h2><p>Partager cette page, c’est empêcher qu’un nom et un visage disparaissent.</p><div class="ux-share__buttons"><a class="ux-button ux-wa" target="_blank" rel="noopener">WhatsApp</a><a class="ux-button ux-fb" target="_blank" rel="noopener">Facebook</a><button class="ux-button ux-copy" type="button">Copier le lien</button></div>';document.body.append(share);const u=encodeURIComponent(location.href),t=encodeURIComponent(document.title);share.querySelector(".ux-wa").href="https://wa.me/?text="+t+"%20"+u;share.querySelector(".ux-fb").href="https://www.facebook.com/sharer/sharer.php?u="+u;share.querySelector(".ux-copy").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast("Lien copié")}catch{prompt("Copiez ce lien",location.href)}};if(!isHome){const nav=document.createElement("nav");nav.className="ux-portrait-nav";nav.innerHTML='<a class="ux-button" href="'+esc(home)+'">← Tous les portraits</a><button class="ux-button ux-random" type="button">Portrait suivant au hasard →</button>';document.body.append(nav);nav.querySelector(".ux-random").onclick=random}const isProfile=()=>{for(const node of document.querySelectorAll('script[type="application/ld+json"]')){try{const data=JSON.parse(node.textContent);if(data["@type"]==="ProfilePage"||Array.isArray(data["@type"])&&data["@type"].includes("ProfilePage"))return true}catch{}}return false};if(isProfile()){const pageText=(document.querySelector("main")?.textContent||document.body.textContent||"").replace(/\s+/g," "),isWoman=/(?:matricule\s*)?31\d{3}(?!\d)/i.test(pageText),isMan=/(?:matricule\s*)?(?:45|46)\d{3}(?!\d)/i.test(pageText);const sourceFile=isWoman?"sources-femmes.html":isMan?"sources-hommes.html":"sources-femmes.html",sourceName=isWoman?"Mémoire Vive — convoi des 31 000":isMan?"Mémoire Vive — convoi des 45 000":"les sources documentaires du mémorial";const sourceCard=document.createElement("section");sourceCard.className="ux-source-card";sourceCard.setAttribute("aria-labelledby","ux-source-title");sourceCard.innerHTML='<h2 id="ux-source-title">Sources et contribution</h2><p><strong>Source documentaire principale :</strong> '+sourceName+'.</p><p>Les références précises et la provenance des photographies sont indiquées lorsqu’elles ont pu être vérifiées. Elles sont complétées progressivement, sans inventer les informations manquantes.</p><div class="ux-source-card__actions"><a class="ux-button" href="'+esc(home+sourceFile)+'">Consulter les sources</a><a class="ux-button ux-button--primary" href="'+esc(home+'contact.html')+'">Signaler une erreur ou transmettre un document</a></div>';share.before(sourceCard)}const lift=document.createElement("nav");lift.className="ux-page-lift";lift.setAttribute("aria-label","Navigation rapide dans la page");lift.innerHTML='<button class="ux-page-lift__top" type="button" aria-label="Remonter en haut de la page" title="Remonter en haut">↑</button><button class="ux-page-lift__bottom" type="button" aria-label="Descendre en bas de la page" title="Descendre en bas">↓</button>';document.body.append(lift);const liftTop=lift.querySelector(".ux-page-lift__top"),liftBottom=lift.querySelector(".ux-page-lift__bottom"),updateLift=()=>{const y=window.scrollY||document.documentElement.scrollTop,max=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);liftTop.disabled=y<20;liftBottom.disabled=y>=max-20};liftTop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});liftBottom.onclick=()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});addEventListener("scroll",updateLift,{passive:true});addEventListener("resize",updateLift);updateLift();const previousFooter=document.querySelector("body>footer");const footer=previousFooter||document.createElement("footer");footer.className="ux-site-footer";footer.innerHTML='<p class="ux-site-footer__name">Mémoire des Déportés</p><p class="ux-site-footer__tagline">Préserver leur histoire, transmettre leur mémoire.</p><nav class="ux-site-footer__links" aria-label="Liens du pied de page"><a href="'+esc(home)+'">Accueil</a><a href="'+esc(home)+'femmes.html">Femmes</a><a href="'+esc(home)+'hommes.html">Hommes</a><a href="'+esc(home)+'sources-femmes.html">Sources femmes</a><a href="'+esc(home)+'sources-hommes.html">Sources hommes</a><a href="'+esc(home)+'contact.html">Contact</a></nav><p class="ux-site-footer__legal">Mémorial bénévole, gratuit et sans publicité.</p>';document.body.append(footer);})();
          JS
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          base=os.environ["SITE_BASE"]
          home=os.environ["SITE_HOME"]
          css=f'<link rel="stylesheet" href="{base}/assets/memorial-ux.css?v=1">'
          script=f'<script defer src="{base}/assets/memorial-ux.js?v=1" data-base="{base}" data-home="{home}"></script>'
          for page in Path(".").rglob("*.html"):
              if ".git" in page.parts or page.name.lower().startswith("google"):
                  continue
              try:
                  text=page.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "</head>" not in text.lower() or "</body>" not in text.lower():
                  continue
              text=re.sub(r'\s*<link[^>]+memorial-ux\.css[^>]*>',"",text,flags=re.I)
              text=re.sub(r'\s*<script[^>]+memorial-ux\.js[^>]*></script>',"",text,flags=re.I)
              text=re.sub(r"</head>",f"  {css}\n</head>",text,count=1,flags=re.I)
              text=re.sub(r"</body>",f"  {script}\n</body>",text,count=1,flags=re.I)
              page.write_text(text,encoding="utf-8")
          PY
      - name: Publier
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets '*.html' '**/*.html'
          git commit -m "Améliore le parcours des visiteurs"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
