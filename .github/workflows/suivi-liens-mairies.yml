name: Suivi hebdomadaire des liens des mairies

on:
  workflow_dispatch:
  schedule:
    - cron: "12 6 * * *"

permissions:
  contents: read

concurrency:
  group: suivi-liens-mairies
  cancel-in-progress: false

jobs:
  controle:
    name: Vérifier les liens des pages municipales renseignées
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Vérifier les pages des mairies
        run: python scripts/suivi_liens_mairies.py
      - name: Afficher le résumé
        if: always()
        run: |
          if [ -f rapport-mairies/rapport.md ]; then
            cat rapport-mairies/rapport.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conserver le rapport détaillé
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suivi-liens-mairies
          path: rapport-mairies/
          if-no-files-found: error
          retention-days: 90
