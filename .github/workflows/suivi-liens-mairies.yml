name: Suivi hebdomadaire des liens des mairies

on:
  workflow_dispatch:
  schedule:
    - cron: "12 6 * * *"

permissions:
  contents: read

concurrency:
  group: suivi-liens-mairies
  cancel-in-progress: false

jobs:
  controle:
    name: Vérifier les liens des pages municipales renseignées
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Vérifier les pages des mairies
        run: python scripts/suivi_liens_mairies.py
      - name: Afficher le résumé
        if: always()
        run: |
          if [ -f rapport-mairies/rapport.md ]; then
            cat rapport-mairies/rapport.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conserver le rapport détaillé
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suivi-liens-mairies
          path: rapport-mairies/
          if-no-files-found: error
          retention-days: 90
