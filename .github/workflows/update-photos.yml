name: Actualiser la photothèque historique

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "update-ushmm-photos"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extraire toutes les notices photographiques
        run: python scripts/scrape_ushmm_photos.py --delay 0.4

      - name: Tester l’extracteur
        run: python -m unittest tests.test_scrape_ushmm_photos -v

      - name: Reconstruire les liens du site
        run: python scripts/build_site.py

      - name: Vérifier les fichiers générés
        run: git diff --check

      - name: Enregistrer la mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ushmm-photos index.html femmes.html hommes.html sitemap.xml robots.txt site-data.json a_verifier.txt
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation de la photothèque historique [skip ci]"
            git push
          fi
