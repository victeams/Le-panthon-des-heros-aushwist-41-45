name: Inventaire quotidien des communes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: inventaire-communes
  cancel-in-progress: false

jobs:
  inventaire:
    name: Préparer les lieux candidats sans publier de pages
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Construire l'inventaire exploratoire
        run: python scripts/inventaire_communes.py
      - name: Publier le résumé dans le journal du workflow
        run: cat rapport-communes/rapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Conserver le rapport et les prévisualisations comme artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inventaire-communes
          path: rapport-communes/
          if-no-files-found: error
          retention-days: 30
