name: Inventaire quotidien des communes

on:
  push:
    paths:
      - "scripts/inventaire_communes.py"
      - ".github/workflows/inventaire-communes.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: inventaire-communes
  cancel-in-progress: false

jobs:
  inventaire:
    name: Préparer les lieux candidats sans publier de pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Construire l'inventaire exploratoire
        run: python scripts/inventaire_communes.py
      - name: Publier le résumé dans le journal du workflow
        if: always()
        run: |
          if [ -f rapport-communes/rapport.md ]; then
            cat rapport-communes/rapport.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Le script n'a pas produit le rapport attendu." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Conserver le rapport et les prévisualisations comme artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inventaire-communes
          path: rapport-communes/
          if-no-files-found: error
          retention-days: 30
