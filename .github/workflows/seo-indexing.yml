name: SEO et indexation Google

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/seo_indexing.py"
      - ".github/workflows/seo-indexing.yml"

concurrency:
  group: "site-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le SEO et reconstruire le sitemap
        run: python scripts/seo_indexing.py
      - name: Enregistrer les améliorations
        run: |
          if git diff --quiet; then
            echo "Aucune modification nécessaire"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' sitemap.xml robots.txt
          git commit -m "Mise à jour automatique SEO et sitemap"
          git push
