name: SEO et indexation Google

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/seo_indexing.py"
      - ".github/workflows/seo-indexing.yml"

concurrency:
  group: "site-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Synchroniser la dernière version
        run: git pull --ff-only origin main
      - name: Intégrer le mémorial des enfants au domaine principal
        run: |
          rm -rf enfants
          git clone --depth 1 https://github.com/victeams/enfants-deportes-1939-1945.git enfants
          rm -rf enfants/.git
          git grep -Il 'https://victeams.github.io/enfants-deportes-1939-1945' -- enfants | xargs -r sed -i 's#https://victeams.github.io/enfants-deportes-1939-1945#https://memoiredesdeportes.fr/enfants#g'
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le SEO et reconstruire le sitemap
        run: python scripts/seo_indexing.py
      - name: Enregistrer les améliorations
        run: |
          if git diff --quiet; then
            echo "Aucune modification nécessaire"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '**/*.html' ':(exclude)enfants/**' sitemap.xml robots.txt
          git commit -m "Mise à jour automatique SEO et sitemap"
          git push
