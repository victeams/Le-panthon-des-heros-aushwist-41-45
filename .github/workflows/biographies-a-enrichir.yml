name: Liste quotidienne des biographies à enrichir

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
  push:
    paths:
      - "scripts/biographies_a_enrichir.py"
      - ".github/workflows/biographies-a-enrichir.yml"

permissions:
  contents: read

concurrency:
  group: biographies-a-enrichir
  cancel-in-progress: false

jobs:
  rapport:
    name: Repérer les manques et préparer les pistes web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt en lecture seule
        uses: actions/checkout@v7.0.1
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Analyser les biographies et rechercher des sources en ligne
        run: python scripts/biographies_a_enrichir.py > /tmp/biographies-a-enrichir-summary.md
      - name: Ajouter un résumé court au journal GitHub
        run: |
          {
            echo "# Biographies à enrichir — résumé quotidien"
            echo
            echo "Le rapport complet et le CSV sont disponibles dans l’artefact de cette exécution."
            echo
            head -n 35 /tmp/biographies-a-enrichir-summary.md | cut -c1-300
            echo
            echo "Résumé volontairement limité pour rester sous la limite GitHub de 1 024 Ko."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conserver le rapport détaillé et le tableau CSV
        uses: actions/upload-artifact@v7
        with:
          name: biographies-a-enrichir-et-recherches-web
          path: |
            rapports/biographies-a-enrichir.md
            rapports/biographies-a-enrichir.csv
          if-no-files-found: error
          retention-days: 30
