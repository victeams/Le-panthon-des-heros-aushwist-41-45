name: Liste quotidienne des biographies à enrichir

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: read

concurrency:
  group: biographies-a-enrichir
  cancel-in-progress: false

jobs:
  rapport:
    name: Générer la liste des biographies à examiner
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt sans modifier le site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Produire le rapport en lecture seule
        run: python scripts/biographies_a_enrichir.py >> "$GITHUB_STEP_SUMMARY"
