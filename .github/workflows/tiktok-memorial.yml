name: Préparer un texte TikTok du mémorial

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  preparer-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Générer un seul texte continu depuis une biographie existante
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import html
          import re
          from pathlib import Path

          excluded = {
              "index.html", "femmes.html", "hommes.html", "photos.html",
              "base-documentaire.html", "404.html", "contact.html",
              "tiktok.html", "mairies-partenaires.html", "a-propos.html",
              "convoi-des-31000.html", "convoi-des-45000.html",
              "carte-camps.html", "carte-parcours.html", "sitemap.html"
          }
          candidates = []
          for folder in (Path("hommes"), Path("femmes"), Path(".")):
              if not folder.exists():
                  continue
              for path in folder.glob("*.html"):
                  if path.name.lower() in excluded or path.name.startswith("_"):
                      continue
                  if path.stat().st_size < 500:
                      continue
                  source = path.read_text(encoding="utf-8", errors="ignore")
                  if not re.search(r"(?<!\d)(?:31|45|46)\d{3}(?!\d)", path.stem + " " + source):
                      continue
                  if not re.search(r"<h1\b", source, re.I):
                      continue
                  candidates.append(path)

          candidates = sorted(set(candidates), key=lambda p: str(p).lower())
          if not candidates:
              raise SystemExit("Aucune fiche biographique candidate trouvée : aucun texte n'a été inventé.")

          week = datetime.date.today().isocalendar().week
          path = candidates[week % len(candidates)]
          source = path.read_text(encoding="utf-8", errors="ignore")

          title_match = re.search(r"<h1\b[^>]*>(.*?)</h1>", source, re.I | re.S)
          if not title_match:
              title_match = re.search(r"<title\b[^>]*>(.*?)</title>", source, re.I | re.S)
          title = html.unescape(re.sub(r"<[^>]+>", " ", title_match.group(1))).strip() if title_match else path.stem.replace("-", " ").replace("_", " ")

          # Garder le contenu éditorial et écarter la navigation et les scripts.
          body = re.search(r"<main\b[^>]*>(.*?)</main>", source, re.I | re.S)
          content = body.group(1) if body else source
          content = re.sub(r"(?is)<(script|style|nav|header|footer|aside|noscript)\b[^>]*>.*?</\1>", " ", content)
          paragraphs = re.findall(r"(?is)<p\b[^>]*>(.*?)</p>", content)
          if paragraphs:
              raw_parts = paragraphs
          else:
              content = re.sub(r"(?i)<br\s*/?>|</li>|</h[2-6]>", "\\n", content)
              raw_parts = content.splitlines()

          cleaned = []
          boilerplate = (
              "mémoire des déportés", "retour à l'accueil", "navigation principale",
              "photothèque", "mairies partenaires", "site gratuit et sans publicité",
              "tous droits réservés", "rechercher dans les fiches"
          )
          for part in raw_parts:
              part = re.sub(r"(?is)<(script|style)\b[^>]*>.*?</\1>", " ", part)
              part = html.unescape(re.sub(r"<[^>]+>", " ", part))
              part = re.sub(r"\s+", " ", part).strip()
              if len(part) < 35 or "http://" in part.lower() or "https://" in part.lower():
                  continue
              if any(phrase in part.lower() for phrase in boilerplate):
                  continue
              cleaned.append(part)

          biography = re.sub(r"\s+", " ", " ".join(cleaned)).strip()
          if len(biography) < 120:
              raise SystemExit(f"Texte biographique insuffisant dans {path}; aucun brouillon générique n'a été fabriqué.")

          # Un seul bloc de texte, sans diapositives, légende séparée, hashtags ni emojis.
          biography = biography[:2800].rsplit(" ", 1)[0] if len(biography) > 2800 else biography
          source_url = "https://memoiredesdeportes.fr/" + str(path).replace("\\", "/").removeprefix("./")
          post = (
              "TU SAVAIS ? " + title + " : " + biography +
              " Pour préserver la mémoire des déportés et transmettre leurs histoires, "
              "retrouve les biographies sur Mémoire des Déportés : " + source_url
          )
          Path("publication-tiktok.txt").write_text(post + "\n", encoding="utf-8")
          print(f"Texte unique préparé depuis : {path}")
          print(f"Longueur : {len(post)} caractères")
          PY

      - name: Afficher le texte unique dans le résumé GitHub
        run: cat publication-tiktok.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver le texte en téléchargement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: texte-unique-tiktok-memorial
          path: publication-tiktok.txt
          if-no-files-found: error
          retention-days: 30
