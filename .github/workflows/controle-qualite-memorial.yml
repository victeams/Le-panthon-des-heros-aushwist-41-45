name: Contrôle qualité du mémorial

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: controle-qualite-memorial
  cancel-in-progress: false

jobs:
  controle:
    name: Vérifier les photos et les matricules
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Analyser les pages sans les modifier
        run: python scripts/controle_qualite_memorial.py >> "$GITHUB_STEP_SUMMARY"
