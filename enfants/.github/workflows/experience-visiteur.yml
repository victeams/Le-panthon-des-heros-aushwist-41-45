name: Améliorer l'expérience des visiteurs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experience-visiteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les améliorations
        env:
          SITE_BASE: "https://victeams.github.io/enfants-deportes-1939-1945"
          SITE_HOME: "https://victeams.github.io/enfants-deportes-1939-1945/"
        run: |
          mkdir -p assets
          cat > assets/memorial-ux.css <<'CSS'
          :root{--ux-gold:#d4ad62;--ux-panel:#171a1f;--ux-line:#403a30;--ux-text:#f4f1e8;--ux-muted:#c2c5ca}
          .ux-visitor-bar{max-width:1180px;margin:18px auto;padding:16px 18px;border:1px solid var(--ux-line);border-radius:14px;background:linear-gradient(135deg,#201c16,var(--ux-panel));color:var(--ux-text);font-family:Arial,Helvetica,sans-serif}.ux-visitor-bar__top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.ux-visitor-bar strong{font-family:Georgia,serif;font-size:1.15rem}.ux-actions{display:flex;gap:8px;flex-wrap:wrap}.ux-button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border:1px solid #76633f;border-radius:999px;background:#d4ad6216;color:var(--ux-gold)!important;font-weight:700;text-decoration:none!important;cursor:pointer}.ux-button:hover,.ux-button:focus{background:#d4ad6229}.ux-button--primary{background:var(--ux-gold);color:#16120d!important}.ux-search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px}.ux-search input{min-height:48px;width:100%;padding:12px 15px;border:1px solid #525862;border-radius:10px;background:#0d1014;color:white;font-size:16px}.ux-search button{border:0}.ux-share{max-width:900px;margin:34px auto 20px;padding:22px;border:1px solid var(--ux-line);border-radius:14px;background:var(--ux-panel);color:var(--ux-text);text-align:center;font-family:Arial,Helvetica,sans-serif}.ux-share h2{margin:0 0 7px;font:1.45rem Georgia,serif}.ux-share p{margin:0 0 15px;color:var(--ux-muted)}.ux-share__buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.ux-portrait-nav{display:flex;justify-content:space-between;gap:10px;max-width:900px;margin:16px auto 30px;padding:0 12px}.ux-toast{position:fixed;left:50%;bottom:22px;z-index:9999;transform:translateX(-50%);padding:11px 16px;border-radius:999px;background:#f4f1e8;color:#111;box-shadow:0 8px 30px #0008;font:700 14px Arial}.ux-home-highlight{max-width:1180px;margin:0 auto 26px;padding:22px;border:1px solid #5d5039;border-radius:15px;background:linear-gradient(135deg,#211d17,#15191f);text-align:center}.ux-home-highlight h2{margin:0 0 8px;font:1.8rem Georgia,serif}.ux-home-highlight p{color:var(--ux-muted)}.ux-counts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.ux-count{padding:7px 12px;border:1px solid #494238;border-radius:999px;color:var(--ux-muted)}
          @media(max-width:680px){.hero,.home-hero{min-height:auto!important;padding-top:24px!important;padding-bottom:24px!important}.brand-logo{width:92px!important}.hero h1{font-size:clamp(1.8rem,9vw,2.6rem)!important}.hero .intro{margin-top:12px!important}.hero .content-notice,.hero .free-notice,.hero .sister-site{margin-top:10px!important}.nav{display:flex!important;flex-wrap:nowrap!important;justify-content:flex-start!important;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a{white-space:nowrap}.ux-visitor-bar{margin:10px 12px;padding:14px}.ux-search{grid-template-columns:1fr}.ux-actions{width:100%}.ux-button{flex:1}.ux-share{margin:24px 12px}.ux-portrait-nav{flex-direction:column}.ux-home-highlight{margin:10px 12px 20px;padding:18px}.grid{scroll-margin-top:120px}}
          CSS
          cat > assets/memorial-ux.js <<'JS'
          (()=>{"use strict";const S=document.currentScript?.dataset||{},home=S.home||"/";const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const toast=t=>{const e=document.createElement("div");e.className="ux-toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};const cards=()=>[...document.querySelectorAll(".card,article.portrait-card,[data-name]")].filter(e=>e.querySelector("a[href]"));const links=()=>[...new Set(cards().map(e=>e.querySelector("a[href]")?.href).filter(Boolean))];const random=()=>{const a=links();location.href=a.length?a[Math.floor(Math.random()*a.length)]:home+"#portraits"};const old=document.querySelector('input[type="search"],#search,#recherche,input[name="search"]');const bar=document.createElement("section");bar.className="ux-visitor-bar";bar.innerHTML='<div class="ux-visitor-bar__top"><strong>Retrouver une histoire, transmettre une mémoire</strong><div class="ux-actions"><a class="ux-button" href="'+esc(home)+'">Accueil</a><button class="ux-button ux-random" type="button">Portrait au hasard</button><a class="ux-button ux-button--primary" href="#ux-search">Rechercher</a></div></div><form class="ux-search" id="ux-search"><input aria-label="Rechercher une personne" type="search" autocomplete="off" placeholder="Nom, prénom ou matricule"><button class="ux-button ux-button--primary" type="submit">Rechercher</button></form>';const target=document.querySelector("main")||document.body.firstElementChild;target.parentNode.insertBefore(bar,target);bar.querySelector(".ux-random").onclick=random;const input=bar.querySelector("input"),filter=()=>{const q=input.value.trim().toLocaleLowerCase("fr");let n=0;cards().forEach(c=>{const ok=!q||c.textContent.toLocaleLowerCase("fr").includes(q);c.hidden=!ok;if(ok)n++});if(old){old.value=q;old.dispatchEvent(new Event("input",{bubbles:true}))}return n};input.oninput=filter;bar.querySelector("form").onsubmit=e=>{e.preventDefault();const n=filter();document.querySelector("#portraits,.grid,.cards")?.scrollIntoView({behavior:"smooth"});if(!n)toast("Aucun portrait trouvé sur cette page")};const clean=u=>u.replace(/index\.html(?:[?#].*)?$/,"").replace(/\/$/,""),isHome=clean(location.href)===clean(home);if(isHome){const box=document.createElement("section");box.className="ux-home-highlight";box.innerHTML='<p style="margin:0;color:var(--ux-gold);font-weight:700">MÉMORIAL NUMÉRIQUE</p><h2>Chaque visage mérite d’être retrouvé</h2><p>Un nouveau portrait est régulièrement ajouté pour que son histoire ne disparaisse jamais.</p><div class="ux-counts"><span class="ux-count"><strong>'+cards().length+'</strong> portraits visibles</span><span class="ux-count">Accès libre et gratuit</span></div><div class="ux-actions" style="justify-content:center;margin-top:14px"><button class="ux-button ux-button--primary ux-random" type="button">Découvrir une histoire</button><a class="ux-button" href="#ux-search">Chercher un proche</a></div>';bar.after(box);box.querySelector(".ux-random").onclick=random}const share=document.createElement("section");share.className="ux-share";share.innerHTML='<h2>Transmettre sa mémoire</h2><p>Partager cette page, c’est empêcher qu’un nom et un visage disparaissent.</p><div class="ux-share__buttons"><a class="ux-button ux-wa" target="_blank" rel="noopener">WhatsApp</a><a class="ux-button ux-fb" target="_blank" rel="noopener">Facebook</a><button class="ux-button ux-copy" type="button">Copier le lien</button></div>';document.body.append(share);const u=encodeURIComponent(location.href),t=encodeURIComponent(document.title);share.querySelector(".ux-wa").href="https://wa.me/?text="+t+"%20"+u;share.querySelector(".ux-fb").href="https://www.facebook.com/sharer/sharer.php?u="+u;share.querySelector(".ux-copy").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast("Lien copié")}catch{prompt("Copiez ce lien",location.href)}};if(!isHome){const nav=document.createElement("nav");nav.className="ux-portrait-nav";nav.innerHTML='<a class="ux-button" href="'+esc(home)+'">← Tous les portraits</a><button class="ux-button ux-random" type="button">Portrait suivant au hasard →</button>';document.body.append(nav);nav.querySelector(".ux-random").onclick=random}})();
          JS
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          base=os.environ["SITE_BASE"]
          home=os.environ["SITE_HOME"]
          css=f'<link rel="stylesheet" href="{base}/assets/memorial-ux.css?v=1">'
          script=f'<script defer src="{base}/assets/memorial-ux.js?v=1" data-base="{base}" data-home="{home}"></script>'
          for page in Path(".").rglob("*.html"):
              if ".git" in page.parts or page.name.lower().startswith("google"):
                  continue
              try:
                  text=page.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "</head>" not in text.lower() or "</body>" not in text.lower():
                  continue
              text=re.sub(r'\s*<link[^>]+memorial-ux\.css[^>]*>',"",text,flags=re.I)
              text=re.sub(r'\s*<script[^>]+memorial-ux\.js[^>]*></script>',"",text,flags=re.I)
              text=re.sub(r"</head>",f"  {css}\n</head>",text,count=1,flags=re.I)
              text=re.sub(r"</body>",f"  {script}\n</body>",text,count=1,flags=re.I)
              page.write_text(text,encoding="utf-8")
          PY
      - name: Publier
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets '*.html' '**/*.html'
          git commit -m "Améliore le parcours des visiteurs"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main
            if git push; then exit 0; fi
            sleep 3
          done
          exit 1
